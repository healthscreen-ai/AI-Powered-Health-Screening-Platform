services:
  - type: web
    name: healthscreen-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "python scripts/apply_migrations.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
